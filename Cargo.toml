[package]
name = "shared-restapi"
version = "0.1.1"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = []
e2e-tests = []

[dependencies]
bytes = "1.10.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli"] }
# Chrome TLS/HTTP2 fingerprint impersonation (BoringSSL-backed). The `rquest`
# crate named in the original task was yanked from crates.io and superseded by
# `wreq` (+ `wreq-util` for browser emulation presets) by the same author.
wreq = { version = "6.0.0-rc.29", default-features = false, features = ["tokio-rt", "webpki-roots", "cookies", "gzip", "brotli"] }
wreq-util = { version = "3.0.0-rc.12", default-features = false, features = ["emulation"] }
serde_json = "1"
sonic-rs = "0.5.6"
thiserror = { version = "2", default-features = false }
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
trybuild = "1.0"
axum = "0.8"
serde = { version = "1", features = ["derive"] }

[[test]]
name = "e2e_jsonrpc"
path = "tests/e2e/e2e_jsonrpc.rs"
required-features = ["e2e-tests"]
